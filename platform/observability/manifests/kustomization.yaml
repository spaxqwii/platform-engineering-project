apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - prometheus/prometheus-stack.yaml
  - grafana/grafana.yaml
  - grafana/grafana-dashboards.yaml

configMapGenerator:
  - name: grafana-admin
    literals:
      - password=admin123

commonLabels:
  app.kubernetes.io/part-of: monitoring
  app.kubernetes.io/managed-by: argocd

images:
  - name: grafana/grafana
    newTag: 10.2.0